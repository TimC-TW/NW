<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資產動態追蹤</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#2C2C2A;min-height:100vh}
.app{max-width:900px;margin:0 auto;padding:1.5rem 1rem}
h1{font-size:18px;font-weight:500;margin-bottom:1.5rem}
.tabs{display:flex;border-bottom:1px solid #D3D1C7;margin-bottom:1.5rem}
.tab{background:none;border:none;padding:9px 18px;font-size:13px;color:#888780;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:#2C2C2A;border-bottom-color:#2C2C2A;font-weight:500}
.section{display:none}.section.active{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem}
.card{background:#fff;border-radius:8px;padding:.85rem 1rem;border:1px solid #E8E6DF}
.card-label{font-size:11px;color:#888780;margin-bottom:3px}
.card-value{font-size:18px;font-weight:500}
.card-sub{font-size:11px;margin-top:2px}
.pos{color:#0F6E56}.neg{color:#A32D2D}.muted{color:#888780}
.chart-box{background:#fff;border-radius:8px;border:1px solid #E8E6DF;padding:1rem;margin-bottom:1.25rem}
.chart-box h3{font-size:12px;color:#888780;font-weight:400;margin-bottom:.75rem}
.chart-wrap{position:relative;width:100%}
.h220{height:220px}.h260{height:260px}.h200{height:200px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;font-size:11px;color:#888780}
.legend span{display:flex;align-items:center;gap:4px}
.ld{width:10px;height:10px;border-radius:2px;display:inline-block}
.toolbar{display:flex;gap:8px;margin-bottom:1rem;align-items:center;flex-wrap:wrap}
.toolbar-right{margin-left:auto;display:flex;gap:6px}
input[type=number],input[type=date],select{padding:6px 10px;font-size:13px;border:1px solid #D3D1C7;border-radius:6px;background:#fff;color:#2C2C2A;width:100%}
input:focus,select:focus{outline:none;border-color:#888780}
.btn{padding:6px 14px;font-size:12px;border:1px solid #D3D1C7;border-radius:6px;cursor:pointer;background:#fff;color:#2C2C2A;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:#f5f5f3}
.btn-primary{background:#2C2C2A;color:#fff;border-color:transparent}.btn-primary:hover{background:#444441}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-danger{color:#A32D2D;border-color:#F7C1C1}.btn-danger:hover{background:#FCEBEB}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:8px;border:1px solid #E8E6DF;overflow:hidden}
th{text-align:left;padding:8px 12px;border-bottom:1px solid #E8E6DF;color:#888780;font-weight:400;font-size:11px;white-space:nowrap;background:#fafaf8}
td{padding:8px 12px;border-bottom:1px solid #f0ede6;color:#2C2C2A}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}
.group-label{font-size:11px;color:#888780;margin:14px 0 6px;font-weight:500;border-bottom:1px solid #E8E6DF;padding-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.fl{display:flex;flex-direction:column;gap:3px}
.fl label{font-size:11px;color:#888780}
.snap-form{background:#fff;border-radius:8px;border:1px solid #E8E6DF;padding:1.25rem}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:flex-start;justify-content:center;z-index:100;padding-top:3rem;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;border:1px solid #E8E6DF;padding:1.5rem;width:min(540px,94%);margin-bottom:2rem}
.modal h3{font-size:15px;font-weight:500;margin-bottom:1.2rem}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.2rem}
.empty{text-align:center;padding:2.5rem;color:#888780;font-size:13px}
.diff-sm{font-size:11px}
.forecast-note{font-size:11px;color:#888780;display:inline-block;padding:2px 7px;background:#F1EFE8;border-radius:4px;margin-left:6px}
@media(max-width:600px){.grid3{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<h1>💰 資產動態追蹤</h1>
<div class="tabs">
  <button class="tab active" onclick="switchTab('overview')">總覽</button>
  <button class="tab" onclick="switchTab('salary')">薪資分析</button>
  <button class="tab" onclick="switchTab('invest')">投資分析</button>
  <button class="tab" onclick="switchTab('snapshot')">記錄快照</button>
  <button class="tab" onclick="switchTab('history')">歷史</button>
</div>

<!-- 總覽 -->
<div id="tab-overview" class="section active">
  <div class="cards" id="sum-cards"></div>
  <div class="chart-box">
    <h3>資產總額走勢（依真實時間間隔）<button onclick="if(trendChart)trendChart.resetZoom()" style="float:right;font-size:11px;padding:2px 8px;border:0.5px solid #D3D1C7;border-radius:4px;background:#fff;cursor:pointer;color:#888780">重置</button></h3>
    <div style="font-size:11px;color:#888780;margin-bottom:6px">滾輪縮放・拖曳平移</div>
    <div class="legend"><span><span class="ld" style="background:#1D9E75"></span>Total NTD</span></div>
    <div class="chart-wrap h260"><canvas id="trendChart"></canvas></div>
  </div>
  <div class="chart-box">
    <h3>資產配置</h3>
    <div class="chart-wrap h260"><canvas id="assetPieChart"></canvas></div>
  </div>
</div>

<!-- 薪資分析 -->
<div id="tab-salary" class="section">
  <div class="cards" id="salary-cards"></div>
  <div class="chart-box">
    <h3>年度薪資（現金 + 總包含RSU）</h3>
    <div class="legend">
      <span><span class="ld" style="background:#1D9E75"></span>現金薪資 NTD</span>
      <span><span class="ld" style="background:#378ADD"></span>RSU 薪資 NTD</span>
    </div>
    <div class="chart-wrap h260"><canvas id="salaryChart"></canvas></div>
  </div>
  <div class="chart-box">
    <h3>年度儲蓄</h3>
    <div class="legend">
      <span><span class="ld" style="background:#1D9E75"></span>Annual Salary NTD</span>
      <span><span class="ld" style="background:#D85A30"></span>Spend NTD</span>
      <span><span class="ld" style="background:#378ADD"></span>年度儲蓄（折線）</span>
    </div>
    <div class="chart-wrap h260"><canvas id="saveChart"></canvas></div>
  </div>
  <div class="chart-box">
    <h3>年化資產成長率（基於 Dynamic Total）</h3>
    <div class="legend"><span><span class="ld" style="background:#D85A30"></span>YoY 成長率 %</span></div>
    <div class="chart-wrap h200"><canvas id="cagrChart"></canvas></div>
  </div>
</div>

<!-- 投資分析 -->
<div id="tab-invest" class="section">
  <div class="cards" id="invest-cards"></div>
  <div class="chart-box">
    <h3>美股市值 vs 總投入成本</h3>
    <div class="legend">
      <span><span class="ld" style="background:#1D9E75"></span>年度獲利（Sum）NTD</span>
      <span><span class="ld" style="background:#D85A30"></span>年化報酬率（右軸）</span>
    </div>
    <div class="chart-wrap h220"><canvas id="usStockChart"></canvas></div>
  </div>
  <div class="chart-box" style="overflow-x:auto">
    <h3>投資明細表</h3>
    <table>
      <thead><tr><th>年份</th><th>美股市值</th><th>總投入</th><th>年化報酬</th><th>台股交易獲利</th><th>配息</th><th>年度獲利</th></tr></thead>
      <tbody id="invest-table"></tbody>
    </table>
  </div>
</div>

<!-- 記錄快照 -->
<div id="tab-snapshot" class="section">
  <div class="snap-form">
    <div class="grid2" style="margin-bottom:14px">
      <div class="fl"><label>日期</label><input type="date" id="snap-date"></div>
    </div>
    <div id="snap-fields"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:1.2rem">
      <button class="btn btn-primary" onclick="saveSnap()"><i class="ti ti-camera"></i> 儲存快照</button>
    </div>
  </div>
</div>

<!-- 歷史 -->
<div id="tab-history" class="section">
  <div class="toolbar">
    <div class="toolbar-right">
      <button class="btn btn-sm" onclick="exportJSON()"><i class="ti ti-download"></i> 匯出 JSON</button>
      <label class="btn btn-sm" style="cursor:pointer"><i class="ti ti-upload"></i> 匯入 JSON<input type="file" accept=".json" style="display:none;width:auto;border:none" onchange="importJSON(event)"></label>
    </div>
  </div>
  <table>
    <thead id="hist-head"></thead>
    <tbody id="hist-body"></tbody>
  </table>
</div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitModal()">儲存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script>
const FIELDS=[
  {key:'美股',group:'流動資產'},{key:'RSU',group:'流動資產'},{key:'美金',group:'流動資產'},
  {key:'台股',group:'流動資產'},{key:'台幣',group:'流動資產'},{key:'小胖台幣 房子',group:'流動資產'},
  {key:'小柏台幣',group:'流動資產'},{key:'台灣的人民幣',group:'流動資產'},
  {key:'中國人民幣(bank)',group:'流動資產'},{key:'小胖人民幣/台幣',group:'流動資產'},
  {key:'房子🏠',group:'固定資產'},{key:'車🚗',group:'固定資產'},
  {key:'ESPP 3538/3722',group:'沒在手上'},{key:'TEP 6000',group:'沒在手上'},
  {key:'Insurance 2923',group:'沒在手上'},{key:'Medical + Pension 2123/2233 + 683',group:'沒在手上'},
  {key:'朱爸朱媽',group:'負債'},{key:'信貸',group:'負債'},{key:'信用卡',group:'負債'},
];
const DEBT_KEYS=['朱爸朱媽','信貸','信用卡'];
const ALLOC_KEYS=['美股','RSU','美金','台股','台幣','小胖台幣 房子','小柏台幣','台灣的人民幣','中國人民幣(bank)','小胖人民幣/台幣','房子🏠','車🚗'];

const YEARLY=[
  {year:'2019',workplace:'Wiwynn',title:'Engineer (08)',cashSalary:192400,annualSalaryNTD:192400,spendNTD:120000,tax:2700,saveNTD:72400,cumSave:72400,forecast:false},
  {year:'2020',workplace:'Wiwynn',title:'Engineer (08)',cashSalary:704700,annualSalaryNTD:704700,spendNTD:550000,tax:0,saveNTD:154700,cumSave:227100,forecast:false},
  {year:'2021',workplace:'Wiwynn',title:'Sr. Engineer (09)',cashSalary:1419030,annualSalaryNTD:1419030,spendNTD:601396,tax:0,saveNTD:817634,cumSave:1044734,forecast:false},
  {year:'2022',workplace:'Wiwynn→Apple',title:'Sr.E / ICT3',cashSalary:2346544,annualSalaryNTD:2315278,spendNTD:1504977,tax:Math.round(30791+73238*4.43),saveNTD:825687,cumSave:1870421,forecast:false},
  {year:'2023',workplace:'Apple',title:'ICT3',cashSalary:2824665,annualSalaryNTD:3411904,spendNTD:1503867,tax:Math.round(93827*4.43),saveNTD:1908037,cumSave:3778458,forecast:false},
  {year:'2024',workplace:'Apple→Meta',title:'ICT3→IC4',cashSalary:3097117,annualSalaryNTD:3820771,spendNTD:2935210,tax:Math.round(35745*4.43)+162840,saveNTD:1652763,cumSave:5431220,forecast:false},
  {year:'2025',workplace:'Meta',title:'IC4',cashSalary:3106596,annualSalaryNTD:3919075,spendNTD:1991520,tax:328016,saveNTD:1927555,cumSave:7358775,forecast:false},
  {year:'2026',workplace:'Meta',title:'IC4→IC5',cashSalary:4422818,annualSalaryNTD:5536679,spendNTD:3200000,tax:700000,saveNTD:2336679,cumSave:9695454,forecast:false},
  {year:'2027',workplace:'Meta',title:'IC5',cashSalary:4240003,annualSalaryNTD:5841159,spendNTD:3050000,tax:850000,saveNTD:2791159,cumSave:12486613,forecast:true},
  {year:'2028',workplace:'Meta',title:'IC5',cashSalary:4392064,annualSalaryNTD:6376570,spendNTD:3050000,tax:850000,saveNTD:3326570,cumSave:15813183,forecast:true},
  {year:'2029',workplace:'Meta',title:'IC5',cashSalary:4543365,annualSalaryNTD:6592207,spendNTD:3050000,tax:850000,saveNTD:3542207,cumSave:19355390,forecast:true},
  {year:'2030',workplace:'Meta',title:'IC5',cashSalary:4699965,annualSalaryNTD:7098984,spendNTD:3050000,tax:850000,saveNTD:4048984,cumSave:23404374,forecast:true},
];

const INVEST=[
  {year:'2020',nextYearMarketValUSD:7200, costUSD:null, usProfitUSD:null, usCAGR:null, twProfit:61616, dividend:0, sum:61616},
  {year:'2021',nextYearMarketValUSD:7182, costUSD:7200, usProfitUSD:-18, usCAGR:-0.0025, twProfit:-132472, dividend:0, sum:-133039},
  {year:'2022',nextYearMarketValUSD:15784, costUSD:24900, usProfitUSD:-9098, usCAGR:-0.365, twProfit:-63600, dividend:0, sum:-350187},
  {year:'2023',nextYearMarketValUSD:71749, costUSD:47819, usProfitUSD:33046, usCAGR:1.854, twProfit:2782, dividend:6640, sum:1050371},
  {year:'2024',nextYearMarketValUSD:120235, costUSD:47819, usProfitUSD:48486, usCAGR:1.676, twProfit:72216, dividend:79640, sum:1679165},
  {year:'2025',nextYearMarketValUSD:241018, costUSD:97232, usProfitUSD:66133, usCAGR:1.421, twProfit:3739, dividend:17790, sum:2104718},
  {year:'2026',nextYearMarketValUSD:275303, costUSD:110618, usProfitUSD:20899, usCAGR:1.087, twProfit:-80000, dividend:0, sum:578318},
];
const USD2NTD=32.5;

let usStockChart=null;

function renderInvest(){
  const last=INVEST[INVEST.length-1];
  const totalUsProfitNTD=INVEST.reduce((s,r)=>s+(r.usProfitUSD||0)*USD2NTD,0);
  const totalTW=INVEST.reduce((s,r)=>s+(r.twProfit||0),0);
  const totalDiv=INVEST.reduce((s,r)=>s+(r.dividend||0),0);

  document.getElementById('invest-cards').innerHTML=`
    <div class="card"><div class="card-label">美股市值 (2027/1/1)</div><div class="card-value">$${fmt((last.nextYearMarketValUSD||0)*USD2NTD)}</div></div>
    <div class="card"><div class="card-label">美股累計獲利</div><div class="card-value pos">$${fmt(totalUsProfitNTD)}</div></div>
    <div class="card"><div class="card-label">台股累計獲利</div><div class="card-value ${totalTW>=0?'pos':'neg'}">${totalTW>=0?'+':''} $${fmt(totalTW)}</div></div>
    <div class="card"><div class="card-label">累計配息</div><div class="card-value pos">$${fmt(totalDiv)}</div></div>`;

  const years=INVEST.map(r=>r.year);
  const sumVals=INVEST.map(r=>r.sum||0);
  const cagrs=INVEST.map(r=>r.usCAGR!==null?parseFloat((r.usCAGR*100).toFixed(1)):null);

  if(usStockChart)usStockChart.destroy();
  usStockChart=new Chart(document.getElementById('usStockChart'),{
    type:'bar',
    data:{labels:years,datasets:[
      {label:'年度獲利（Sum）',data:sumVals,backgroundColor:sumVals.map(v=>v>=0?'#1D9E75':'#A32D2D'),borderRadius:4,order:2,yAxisID:'y'},
      {label:'年化報酬',data:cagrs,type:'line',borderColor:'#D85A30',backgroundColor:'transparent',borderWidth:2,pointRadius:4,pointBackgroundColor:'#D85A30',tension:0.3,order:1,yAxisID:'y2'},
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label==='年化報酬'?` ${c.parsed.y}%`:' $'+fmt(c.parsed.y)+' NTD'}}},
      scales:{
        x:{ticks:{font:{size:11},color:'#888780'},grid:{display:false}},
        y:{ticks:{font:{size:10},color:'#888780',callback:v=>fmtK(v)},grid:{color:'rgba(0,0,0,0.05)'}},
        y2:{position:'right',ticks:{font:{size:10},color:'#D85A30',callback:v=>v+'%'},grid:{display:false}}
      }}
  });

  document.getElementById('invest-table').innerHTML=INVEST.map(r=>{
    const mvNTD=r.nextYearMarketValUSD!=null?r.nextYearMarketValUSD*USD2NTD:null;
    const costNTD=r.costUSD!=null?r.costUSD*USD2NTD:null;
    const usProfitNTD=r.usProfitUSD!=null?r.usProfitUSD*USD2NTD:null;
    return`<tr>
      <td><strong>${r.year}</strong></td>
      <td>${mvNTD!=null?'$'+fmt(mvNTD):'—'}</td>
      <td>${costNTD!=null?'$'+fmt(costNTD):'—'}</td>
      <td class="${(r.usCAGR||0)>=0?'pos':'neg'}">${r.usCAGR!=null?(r.usCAGR*100).toFixed(1)+'%':'—'}</td>
      <td class="${(r.twProfit||0)>=0?'pos':'neg'}">${r.twProfit!=null?(r.twProfit>=0?'+':'')+' $'+fmt(r.twProfit):'—'}</td>
      <td>$${fmt(r.dividend||0)}</td>
      <td class="${(r.sum||0)>=0?'pos':'neg'}"><strong>${(r.sum>=0?'+':'')+' $'+fmt(r.sum||0)}</strong></td>
    </tr>`}).join('');
}

let trendChart=null,salaryChart=null,saveChart=null,cagrChart=null,assetPieChart=null;
let snapshots=JSON.parse(localStorage.getItem('dynamic_snapshots')||'[]');

function save(){localStorage.setItem('dynamic_snapshots',JSON.stringify(snapshots));}
function fmt(n){return Math.round(n).toLocaleString();}
function fmtK(n){return n>=10000?Math.round(n/10000)+'萬':fmt(n);}

function calcTotal(s){
  if(s._total!==undefined)return s._total;
  let t=0;
  FIELDS.forEach(f=>{const v=s[f.key]||0;t+=f.group==='負債'?-Math.abs(v):v;});
  return t;
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['overview','salary','invest','snapshot','history'][i]===t));
  document.querySelectorAll('.section').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  if(t==='overview')renderOverview();
  if(t==='salary')renderSalary();
  if(t==='invest')renderInvest();
  if(t==='snapshot')renderSnapForm();
  if(t==='history')renderHistory();
}

/* ── 總覽 ── */
function renderOverview(){
  if(!snapshots.length){document.getElementById('sum-cards').innerHTML='<div class="empty">尚無資料，請先記錄一筆快照或在「歷史」頁匯入 JSON</div>';return;}
  const last=snapshots[snapshots.length-1];
  const prev=snapshots.length>1?snapshots[snapshots.length-2]:null;
  const total=calcTotal(last),prevT=prev?calcTotal(prev):0,diff=total-prevT;
  const USD_KEYS=['美股','RSU','美金'];
  const TWD_KEYS=['台股','台幣','小胖台幣 房子','小柏台幣'];
  const RMB_KEYS=['台灣的人民幣','中國人民幣(bank)','小胖人民幣/台幣'];
  const RMB2NTD=4.43;
  const usdToNTD=v=>v*32.5;
  const liquidUSD=USD_KEYS.reduce((s,k)=>s+Math.max(0,last[k]||0),0);
  const liquidTWD=TWD_KEYS.reduce((s,k)=>s+(last[k]||0),0);
  const liquidRMB=RMB_KEYS.reduce((s,k)=>s+Math.max(0,last[k]||0),0);
  const liquid=usdToNTD(liquidUSD)+liquidTWD+liquidRMB*RMB2NTD;
  const fixed=Math.max(0,last['房子🏠']||0)+Math.max(0,last['車🚗']||0);
  const debt=DEBT_KEYS.reduce((s,k)=>s+Math.abs(last[k]||0),0);

  // CAGR from first snapshot
  const first=snapshots[0];
  const firstTotal=calcTotal(first);
  const years=(new Date(last.date)-new Date(first.date))/(365.25*24*3600*1000);
  const cagr=years>0?((Math.pow(total/firstTotal,1/years)-1)*100):0;

  document.getElementById('sum-cards').innerHTML=`
    <div class="card"><div class="card-label">總資產 NTD</div><div class="card-value">$${fmt(total)}</div>
      <div class="card-sub ${diff>=0?'pos':'neg'}">${prev?(diff>=0?'▲':'▼')+' $'+fmt(Math.abs(diff)):''}</div></div>
    <div class="card"><div class="card-label">流動資產</div><div class="card-value">$${fmt(liquid)}</div></div>
    <div class="card"><div class="card-label">固定資產</div><div class="card-value">$${fmt(fixed)}</div></div>
    <div class="card"><div class="card-label">負債</div><div class="card-value neg">-$${fmt(debt)}</div></div>
    <div class="card"><div class="card-label">年化成長率</div><div class="card-value pos">${cagr.toFixed(1)}%</div><div class="card-sub muted">since ${first.date}</div></div>
    <div class="card"><div class="card-label">最後更新</div><div class="card-value" style="font-size:13px">${last.date}</div></div>`;

  // Asset allocation - USD keys converted to NTD
  const majorAssets=[
    {label:'美金總額',value:Math.max(0,['美股','RSU','美金'].reduce((s,k)=>s+(last[k]||0),0)*32.5)},
    {label:'台幣總額',value:Math.max(0,['台股','台幣','小胖台幣 房子','小柏台幣'].reduce((s,k)=>s+(last[k]||0),0))},
    {label:'車子',value:Math.max(0,last['車🚗']||0)},
    {label:'房子',value:Math.max(0,last['房子🏠']||0)}
  ];
  const classifiedTotal=majorAssets.reduce((s,a)=>s+a.value,0);
  const dynamicTotal=Math.max(0,calcTotal(last));
  const otherValue=Math.max(0,dynamicTotal-classifiedTotal);
  if(otherValue>0)majorAssets.push({label:'其他',value:otherValue});

  const assetLabels=majorAssets.map(a=>a.label);
  const assetVals=majorAssets.map(a=>a.value);
  const assetTotal=assetVals.reduce((a,v)=>a+v,0);

  // Gradient colors from green to blue
  const gradColors=['#1D9E75','#2E8B6E','#3A7A9C','#378ADD','#6AAEE8','#9FC8F0','#B5D4F4'];
  const pieColors=assetLabels.map((_,i)=>gradColors[i]||gradColors[gradColors.length-1]);

  if(trendChart)trendChart.destroy();
  const tdata=snapshots.map(s=>({x:s.date,y:calcTotal(s)}));
  trendChart=new Chart(document.getElementById('trendChart'),{
    type:'line',
    data:{datasets:[{label:'Total',data:tdata,borderColor:'#1D9E75',backgroundColor:'rgba(29,158,117,0.07)',borderWidth:2,fill:true,tension:0.3,pointRadius:tdata.length>30?0:3,pointHoverRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            title:items=>{
              // Find nearest actual data point to hovered x
              const hx=items[0].parsed.x;
              let nearest=tdata[0];
              let minDiff=Infinity;
              tdata.forEach(p=>{
                const d=Math.abs(new Date(p.x).getTime()-hx);
                if(d<minDiff){minDiff=d;nearest=p;}
              });
              return nearest.x;
            },
            label:items=>{
              const hx=items.parsed.x;
              let nearest=tdata[0];
              let minDiff=Infinity;
              tdata.forEach(p=>{
                const d=Math.abs(new Date(p.x).getTime()-hx);
                if(d<minDiff){minDiff=d;nearest=p;}
              });
              const prev=tdata[tdata.indexOf(nearest)-1];
              const diff=prev?nearest.y-prev.y:null;
              const diffStr=diff!=null?(diff>=0?' ▲ +$':' ▼ -$')+fmt(Math.abs(diff)):'';
              return` $${fmt(nearest.y)} NTD${diffStr}`;
            }
          }
        },
        zoom:{
          zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:'x'},
          pan:{enabled:true,mode:'x'},
          limits:{x:{minRange:1000*60*60*24*30}}
        }
      },
      scales:{
        x:{type:tdata.length>1?'time':'category',time:{unit:'month',displayFormats:{month:'yy/MM'}},ticks:{font:{size:10},color:'#888780'},grid:{color:'rgba(0,0,0,0.05)'}},
        y:{ticks:{font:{size:10},color:'#888780',callback:v=>'$'+fmtK(v)},grid:{color:'rgba(0,0,0,0.05)'}}
      }}
  });

  if(assetPieChart)assetPieChart.destroy();
  assetPieChart=new Chart(document.getElementById('assetPieChart'),{
    type:'doughnut',
    data:{
      labels:assetLabels,
      datasets:[{data:assetVals,backgroundColor:pieColors,borderWidth:0}]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{
          position:'right',
          labels:{
            font:{size:11},
            generateLabels:chart=>{
              const ds=chart.data.datasets[0];
              return chart.data.labels.map((label,i)=>{
                const v=ds.data[i]||0;
                const pct=assetTotal>0?(v/assetTotal*100).toFixed(1):'0.0';
                return{text:`${label}  ${pct}%`,fillStyle:ds.backgroundColor[i],strokeStyle:'transparent',index:i};
              });
            }
          }
        },
        tooltip:{callbacks:{
          label:c=>{
            const v=c.parsed||0;
            const pct=assetTotal>0?(v/assetTotal*100).toFixed(1):'0.0';
            return` $${fmt(v)} NTD (${pct}%)`;
          }
        }}
      },
      cutout:'60%'
    }
  });
}

/* ── 薪資分析 ── */
function renderSalary(){
  const actual=YEARLY.filter(y=>!y.forecast);
  const allYears=YEARLY.map(y=>y.year);

  // Summary cards
  const lastActual=actual[actual.length-1];
  const firstActual=YEARLY.find(y=>y.year==='2020');
  const salYears=lastActual&&firstActual?(parseInt(lastActual.year)-parseInt(firstActual.year)):0;
  const salCAGR=salYears>0?((Math.pow(lastActual.annualSalaryNTD/firstActual.annualSalaryNTD,1/salYears)-1)*100):0;

  document.getElementById('salary-cards').innerHTML=`
    <div class="card"><div class="card-label">2026 總薪資</div><div class="card-value">$${fmtK(YEARLY.find(y=>y.year==='2026').annualSalaryNTD)}</div></div>
    <div class="card"><div class="card-label">薪資年化成長</div><div class="card-value pos">${salCAGR.toFixed(1)}%</div><div class="card-sub muted">2020→2025</div></div>
    <div class="card"><div class="card-label">2026 年度儲蓄</div><div class="card-value">$${fmtK(YEARLY.find(y=>y.year==='2026').saveNTD)}</div></div>
    <div class="card"><div class="card-label">2030 預測總薪酬</div><div class="card-value">$${fmtK(YEARLY.find(y=>y.year==='2030').annualSalaryNTD)}</div></div>`;

  // Salary bar chart — cash salary + RSU salary stacked; forecast bars lighter
  const cashData=YEARLY.map(y=>y.cashSalary||0);
  const rsuData=YEARLY.map(y=>Math.max(0,(y.annualSalaryNTD||0)-(y.cashSalary||0)));
  const cutIdx=YEARLY.findIndex(y=>y.forecast);

  if(salaryChart)salaryChart.destroy();
  salaryChart=new Chart(document.getElementById('salaryChart'),{
    type:'bar',
    data:{
      labels:allYears,
      datasets:[
        {label:'現金薪資',data:cashData,backgroundColor:allYears.map((_,i)=>i<cutIdx?'#1D9E75':'rgba(29,158,117,0.35)'),borderRadius:4,stack:'salary'},
        {label:'RSU薪資',data:rsuData,backgroundColor:allYears.map((_,i)=>i<cutIdx?'#378ADD':'rgba(55,138,221,0.35)'),borderRadius:4,stack:'salary'},
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.dataset.label+': $'+fmt(c.parsed.y)+' NTD'}}},
      scales:{
        x:{stacked:true,ticks:{font:{size:11},color:'#888780'},grid:{display:false}},
        y:{stacked:true,ticks:{font:{size:10},color:'#888780',callback:v=>'$'+fmtK(v)},grid:{color:'rgba(0,0,0,0.05)'}}
      }}
  });

  // 年度儲蓄: Annual Salary NTD + Spend NTD as bars, saveNTD as line
  const saveYears=YEARLY.map(y=>y.year);
  const annualVals=YEARLY.map(y=>y.annualSalaryNTD);
  const spendVals=YEARLY.map(y=>y.spendNTD||0);
  const saveLineVals=YEARLY.map(y=>y.saveNTD||0);

  if(saveChart)saveChart.destroy();
  saveChart=new Chart(document.getElementById('saveChart'),{
    type:'bar',
    data:{
      labels:saveYears,
      datasets:[
        {label:'Annual Salary NTD',data:annualVals,backgroundColor:saveYears.map((_,i)=>i<cutIdx?'#1D9E75':'rgba(29,158,117,0.35)'),borderRadius:4,order:3},
        {label:'Spend NTD',data:spendVals,backgroundColor:saveYears.map((_,i)=>i<cutIdx?'#D85A30':'rgba(216,90,48,0.35)'),borderRadius:4,order:2},
        {label:'年度儲蓄',data:saveLineVals,type:'line',borderColor:'#378ADD',backgroundColor:'transparent',borderWidth:2,pointRadius:3,tension:0.3,order:1},
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>{
        if(c.dataset.label==='年度儲蓄') return` 儲蓄: $${fmt(c.parsed.y)} NTD`;
        if(c.dataset.label==='Spend NTD') return` 支出: $${fmt(c.parsed.y)} NTD`;
        return` 薪酬: $${fmt(c.parsed.y)} NTD`;
      }}}},
      scales:{
        x:{ticks:{font:{size:11},color:'#888780'},grid:{display:false}},
        y:{ticks:{font:{size:10},color:'#888780',callback:v=>'$'+fmtK(v)},grid:{color:'rgba(0,0,0,0.05)'}}
      }}
  });

  // YoY CAGR from Dynamic
  const cagrYears=[],cagrVals=[],cagrColors=[];
  const dynSorted=snapshots.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const yearEnds={};
  dynSorted.forEach(s=>{const y=s.date.slice(0,4);yearEnds[y]=s;});
  const yk=Object.keys(yearEnds).sort();
  for(let i=1;i<yk.length;i++){
    const y=yk[i],py=yk[i-1];
    const t=calcTotal(yearEnds[y]),pt=calcTotal(yearEnds[py]);
    if(pt>0){
      const g=((t/pt)-1)*100;
      cagrYears.push(y);cagrVals.push(parseFloat(g.toFixed(1)));
      cagrColors.push(g>=0?'#1D9E75':'#A32D2D');
    }
  }
  if(cagrChart)cagrChart.destroy();
  cagrChart=new Chart(document.getElementById('cagrChart'),{
    type:'bar',
    data:{labels:cagrYears,datasets:[{label:'YoY %',data:cagrVals,backgroundColor:cagrColors,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.parsed.y.toFixed(1)}%`}}},
      scales:{
        x:{ticks:{font:{size:11},color:'#888780'},grid:{display:false}},
        y:{ticks:{font:{size:10},color:'#888780',callback:v=>v+'%'},grid:{color:'rgba(0,0,0,0.05)'},
           afterDataLimits:axis=>{axis.max=Math.max(axis.max,10);}}
      }}
  });

}

/* ── 快照表單 ── */
function renderSnapForm(){
  const last=snapshots.length?snapshots[snapshots.length-1]:{};
  document.getElementById('snap-date').value=new Date().toISOString().slice(0,10);
  const groups=[...new Set(FIELDS.map(f=>f.group))];
  let html='';
  groups.forEach(g=>{
    html+=`<div class="group-label">${g}</div><div class="grid3">`;
    FIELDS.filter(f=>f.group===g).forEach(f=>{
      html+=`<div class="fl"><label>${f.key}</label><input type="number" id="sf-${f.key.replace(/[^\w]/g,'_')}" value="${last[f.key]||0}"></div>`;
    });
    html+='</div>';
  });
  document.getElementById('snap-fields').innerHTML=html;
}

function saveSnap(){
  const date=document.getElementById('snap-date').value;
  if(!date){alert('請選擇日期');return;}
  const snap={date};
  FIELDS.forEach(f=>{snap[f.key]=parseFloat(document.getElementById('sf-'+f.key.replace(/[^\w]/g,'_')).value)||0;});
  const ex=snapshots.findIndex(s=>s.date===date);
  if(ex>=0){if(!confirm('此日期已有快照，確定覆蓋？'))return;snapshots[ex]=snap;}
  else snapshots.push(snap);
  snapshots.sort((a,b)=>a.date.localeCompare(b.date));
  save();alert('已儲存！');switchTab('overview');
}

/* ── 歷史 ── */
function renderHistory(){
  if(!snapshots.length){
    document.getElementById('hist-head').innerHTML='';
    document.getElementById('hist-body').innerHTML='<tr><td colspan="6" class="empty">尚無快照</td></tr>';
    return;
  }
  document.getElementById('hist-head').innerHTML='<tr><th>日期</th><th>流動資產</th><th>固定資產</th><th>負債</th><th>Total NTD</th><th></th></tr>';
  document.getElementById('hist-body').innerHTML=snapshots.slice().reverse().map((s,i)=>{
    const idx=snapshots.length-1-i;
    const total=calcTotal(s),prev=idx>0?calcTotal(snapshots[idx-1]):null,diff=prev!==null?total-prev:null;
    const liquidUSD2=['美股','RSU','美金'].reduce((a,k)=>a+Math.max(0,s[k]||0),0);
    const liquidTWD2=['台股','台幣','小胖台幣 房子','小柏台幣'].reduce((a,k)=>a+(s[k]||0),0);
    const liquidRMB2=['台灣的人民幣','中國人民幣(bank)','小胖人民幣/台幣'].reduce((a,k)=>a+Math.max(0,s[k]||0),0);
    const liquid=liquidUSD2*32.5+liquidTWD2+liquidRMB2*4.43;
    const fixed=Math.max(0,s['房子🏠']||0)+Math.max(0,s['車🚗']||0);
    const debt=DEBT_KEYS.reduce((a,k)=>a+Math.abs(s[k]||0),0);
    return`<tr>
      <td><strong>${s.date}</strong></td>
      <td>$${fmt(liquid)}</td><td>$${fmt(fixed)}</td>
      <td class="neg">-$${fmt(debt)}</td>
      <td><strong>$${fmt(total)}</strong>${diff!==null?`<br><span class="diff-sm ${diff>=0?'pos':'neg'}">${diff>=0?'▲':'▼'} $${fmt(Math.abs(diff))}</span>`:''}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-sm" onclick="editSnap(${idx})" style="margin-right:4px"><i class="ti ti-edit"></i></button>
        <button class="btn btn-sm btn-danger" onclick="deleteSnap(${idx})"><i class="ti ti-trash"></i></button>
      </td></tr>`;
  }).join('');
}

function editSnap(idx){
  const s=snapshots[idx];
  const groups=[...new Set(FIELDS.map(f=>f.group))];
  let html=`<div class="grid2" style="margin-bottom:14px"><div class="fl"><label>日期</label><input type="date" id="es-date" value="${s.date}"></div></div>`;
  groups.forEach(g=>{
    html+=`<div class="group-label">${g}</div><div class="grid3">`;
    FIELDS.filter(f=>f.group===g).forEach(f=>{html+=`<div class="fl"><label>${f.key}</label><input type="number" id="es-${f.key.replace(/[^\w]/g,'_')}" value="${s[f.key]||0}"></div>`;});
    html+='</div>';
  });
  document.getElementById('modal-title').textContent='編輯快照 '+s.date;
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal-bg').dataset.idx=idx;
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');}
function submitModal(){
  const idx=parseInt(document.getElementById('modal-bg').dataset.idx);
  const snap={date:document.getElementById('es-date').value};
  FIELDS.forEach(f=>{snap[f.key]=parseFloat(document.getElementById('es-'+f.key.replace(/[^\w]/g,'_')).value)||0;});
  snapshots[idx]=snap;snapshots.sort((a,b)=>a.date.localeCompare(b.date));
  save();closeModal();renderHistory();
}
function deleteSnap(idx){if(!confirm('確定刪除此快照？'))return;snapshots.splice(idx,1);save();renderHistory();}

function exportJSON(){
  const blob=new Blob([JSON.stringify(snapshots,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='dynamic_assets_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importJSON(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      snapshots=Array.isArray(data)?data:(data.snapshots||[]);
      snapshots.sort((a,b)=>a.date.localeCompare(b.date));
      save();renderOverview();
      alert('匯入成功！共 '+snapshots.length+' 筆快照');
    }catch(err){alert('JSON 格式錯誤：'+err.message);}
  };
  r.readAsText(file);
}

renderOverview();
document.getElementById('snap-date').value=new Date().toISOString().slice(0,10);
</script>
