<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資產動態追蹤</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#2C2C2A;min-height:100vh}
.app{max-width:860px;margin:0 auto;padding:1.5rem 1rem}
h1{font-size:18px;font-weight:500;margin-bottom:1.5rem;color:#2C2C2A}
.tabs{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:1px solid #D3D1C7}
.tab{background:none;border:none;padding:9px 18px;font-size:13px;color:#888780;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:#2C2C2A;border-bottom-color:#2C2C2A;font-weight:500}
.section{display:none}.section.active{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem}
.card{background:#fff;border-radius:8px;padding:.85rem 1rem;border:1px solid #E8E6DF}
.card-label{font-size:11px;color:#888780;margin-bottom:3px}
.card-value{font-size:18px;font-weight:500}
.card-sub{font-size:11px;margin-top:2px}
.pos{color:#0F6E56}.neg{color:#A32D2D}
.chart-wrap{position:relative;width:100%;height:240px;margin-bottom:1.5rem;background:#fff;border-radius:8px;border:1px solid #E8E6DF;padding:1rem}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:8px;font-size:11px;color:#888780}
.legend span{display:flex;align-items:center;gap:4px}
.legend-dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.toolbar{display:flex;gap:8px;margin-bottom:1rem;align-items:center;flex-wrap:wrap}
.toolbar-right{margin-left:auto;display:flex;gap:6px}
input[type=number],input[type=date],select{padding:6px 10px;font-size:13px;border:1px solid #D3D1C7;border-radius:6px;background:#fff;color:#2C2C2A;width:100%}
input:focus,select:focus{outline:none;border-color:#888780}
.btn{padding:6px 14px;font-size:12px;border:1px solid #D3D1C7;border-radius:6px;cursor:pointer;background:#fff;color:#2C2C2A;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:#f5f5f3}
.btn-primary{background:#2C2C2A;color:#fff;border-color:transparent}
.btn-primary:hover{background:#444441}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-danger{color:#A32D2D;border-color:#F7C1C1}.btn-danger:hover{background:#FCEBEB}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:8px;border:1px solid #E8E6DF;overflow:hidden}
th{text-align:left;padding:8px 12px;border-bottom:1px solid #E8E6DF;color:#888780;font-weight:400;font-size:11px;white-space:nowrap;background:#fafaf8}
td{padding:8px 12px;border-bottom:1px solid #f0ede6;color:#2C2C2A}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}
.group-label{font-size:11px;color:#888780;margin:14px 0 6px;font-weight:500;border-bottom:1px solid #E8E6DF;padding-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.fl{display:flex;flex-direction:column;gap:3px}
.fl label{font-size:11px;color:#888780}
.snap-form{background:#fff;border-radius:8px;border:1px solid #E8E6DF;padding:1.25rem}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:flex-start;justify-content:center;z-index:100;padding-top:3rem;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;border:1px solid #E8E6DF;padding:1.5rem;width:min(540px,94%);margin-bottom:2rem}
.modal h3{font-size:15px;font-weight:500;margin-bottom:1.2rem}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1.2rem}
.empty{text-align:center;padding:2.5rem;color:#888780;font-size:13px}
.diff-sm{font-size:11px}
@media(max-width:600px){.grid3{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <h1>💰 資產動態追蹤</h1>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('overview')">總覽</button>
    <button class="tab" onclick="switchTab('snapshot')">記錄快照</button>
    <button class="tab" onclick="switchTab('history')">歷史</button>
  </div>

  <div id="tab-overview" class="section active">
    <div class="cards" id="sum-cards"></div>
    <div class="legend" id="trend-legend"><span><span class="legend-dot" style="background:#1D9E75"></span>Total NTD</span></div>
    <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
    <div class="legend" id="alloc-legend"></div>
    <div class="chart-wrap"><canvas id="allocChart"></canvas></div>
  </div>

  <div id="tab-snapshot" class="section">
    <div class="snap-form">
      <div class="grid2" style="margin-bottom:14px">
        <div class="fl"><label>日期</label><input type="date" id="snap-date"></div>
      </div>
      <div id="snap-fields"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:1.2rem">
        <button class="btn btn-primary" onclick="saveSnap()"><i class="ti ti-camera"></i> 儲存快照</button>
      </div>
    </div>
  </div>

  <div id="tab-history" class="section">
    <div class="toolbar">
      <div class="toolbar-right">
        <button class="btn btn-sm" onclick="exportJSON()"><i class="ti ti-download"></i> 匯出 JSON</button>
        <label class="btn btn-sm" style="cursor:pointer"><i class="ti ti-upload"></i> 匯入 JSON<input type="file" accept=".json" style="display:none;width:auto;border:none" onchange="importJSON(event)"></label>
      </div>
    </div>
    <table>
      <thead id="hist-head"></thead>
      <tbody id="hist-body"></tbody>
    </table>
  </div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitModal()">儲存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
const FIELDS = [
  {key:'美股',group:'流動資產'},{key:'RSU',group:'流動資產'},{key:'美金',group:'流動資產'},
  {key:'台股',group:'流動資產'},{key:'台幣',group:'流動資產'},{key:'小胖台幣 房子',group:'流動資產'},
  {key:'小柏台幣',group:'流動資產'},{key:'台灣的人民幣',group:'流動資產'},
  {key:'中國人民幣(bank)',group:'流動資產'},{key:'小胖人民幣/台幣',group:'流動資產'},
  {key:'房子🏠',group:'固定資產'},{key:'車🚗',group:'固定資產'},
  {key:'ESPP 3538/3722',group:'沒在手上'},{key:'TEP 6000',group:'沒在手上'},
  {key:'Insurance 2923',group:'沒在手上'},{key:'Medical + Pension 2123/2233 + 683',group:'沒在手上'},
  {key:'朱爸朱媽',group:'負債'},{key:'信貸',group:'負債'},{key:'信用卡',group:'負債'},
];
const ALLOC_KEYS=['美股','RSU','美金','台股','台幣','小胖台幣 房子','小柏台幣','台灣的人民幣','中國人民幣(bank)','小胖人民幣/台幣','房子🏠','車🚗'];
const ALLOC_COLORS=['#1D9E75','#378ADD','#85B7EB','#BA7517','#EF9F27','#FAC775','#B5D4F4','#5DCAA5','#9FE1CB','#E1F5EE','#D85A30','#888780'];
const DEBT_KEYS=['朱爸朱媽','信貸','信用卡'];

let snapshots = JSON.parse(localStorage.getItem('dynamic_snapshots')||'[]');
let trendChart=null, allocChart=null;

function save(){localStorage.setItem('dynamic_snapshots',JSON.stringify(snapshots));}
function fmt(n){return Math.round(n).toLocaleString();}
function fmtK(n){return n>=10000?(n/10000).toFixed(1)+'萬':fmt(n);}

function calcTotal(s){
  let t=0;
  FIELDS.forEach(f=>{
    const v=s[f.key]||0;
    t += f.group==='負債' ? -Math.abs(v) : v;
  });
  return t;
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['overview','snapshot','history'][i]===t));
  document.querySelectorAll('.section').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  if(t==='overview')renderOverview();
  if(t==='snapshot')renderSnapForm();
  if(t==='history')renderHistory();
}

function renderOverview(){
  if(!snapshots.length){document.getElementById('sum-cards').innerHTML='<div class="empty">尚無資料，請先記錄一筆快照</div>';return;}
  const last=snapshots[snapshots.length-1];
  const prev=snapshots.length>1?snapshots[snapshots.length-2]:null;
  const total=calcTotal(last);
  const prevTotal=prev?calcTotal(prev):0;
  const diff=total-prevTotal;
  const liquid=ALLOC_KEYS.slice(0,10).reduce((s,k)=>s+(last[k]||0),0);
  const fixed=(last['房子🏠']||0)+(last['車🚗']||0);
  const debt=DEBT_KEYS.reduce((s,k)=>s+Math.abs(last[k]||0),0);

  document.getElementById('sum-cards').innerHTML=`
    <div class="card"><div class="card-label">總資產 NTD</div><div class="card-value">$${fmt(total)}</div><div class="card-sub ${diff>=0?'pos':'neg'}">${prev?(diff>=0?'▲':'▼')+' $'+fmt(Math.abs(diff)):''}</div></div>
    <div class="card"><div class="card-label">流動資產</div><div class="card-value">$${fmt(liquid)}</div></div>
    <div class="card"><div class="card-label">固定資產</div><div class="card-value">$${fmt(fixed)}</div></div>
    <div class="card"><div class="card-label">負債</div><div class="card-value neg">-$${fmt(debt)}</div></div>
    <div class="card"><div class="card-label">最後更新</div><div class="card-value" style="font-size:13px">${last.date}</div></div>`;

  if(trendChart)trendChart.destroy();
  const tdata=snapshots.map(s=>({x:s.date,y:calcTotal(s)}));
  trendChart=new Chart(document.getElementById('trendChart'),{
    type:'line',
    data:{datasets:[{label:'Total',data:tdata,borderColor:'#1D9E75',backgroundColor:'rgba(29,158,117,0.07)',borderWidth:2,fill:true,tension:0.3,pointRadius:tdata.length>30?0:3,pointHoverRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' $'+fmt(c.parsed.y)+' NTD'}}},
      scales:{
        x:{type:tdata.length>1?'time':'category',time:{unit:'month',displayFormats:{month:'yy/MM'}},ticks:{font:{size:10},color:'#888780'},grid:{color:'rgba(0,0,0,0.05)'}},
        y:{ticks:{font:{size:10},color:'#888780',callback:v=>'$'+fmtK(v)},grid:{color:'rgba(0,0,0,0.05)'}}
      }}
  });

  const allocVals=ALLOC_KEYS.map(k=>Math.max(last[k]||0,0));
  const allocTotal=allocVals.reduce((a,b)=>a+b,0);
  document.getElementById('alloc-legend').innerHTML=ALLOC_KEYS.map((k,i)=>
    `<span><span class="legend-dot" style="background:${ALLOC_COLORS[i]}"></span>${k} ${allocTotal?((allocVals[i]/allocTotal*100).toFixed(1)):'0'}%</span>`
  ).join('');
  if(allocChart)allocChart.destroy();
  allocChart=new Chart(document.getElementById('allocChart'),{
    type:'doughnut',
    data:{labels:ALLOC_KEYS,datasets:[{data:allocVals,backgroundColor:ALLOC_COLORS,borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' $'+fmt(c.parsed)+' NTD'}}},cutout:'60%'}
  });
}

function renderSnapForm(){
  const last=snapshots.length?snapshots[snapshots.length-1]:{};
  const today=new Date().toISOString().slice(0,10);
  document.getElementById('snap-date').value=today;
  const groups=[...new Set(FIELDS.map(f=>f.group))];
  let html='';
  groups.forEach(g=>{
    html+=`<div class="group-label">${g}</div><div class="grid3">`;
    FIELDS.filter(f=>f.group===g).forEach(f=>{
      const id='sf-'+f.key.replace(/[^\w]/g,'_');
      html+=`<div class="fl"><label>${f.key}</label><input type="number" id="${id}" value="${last[f.key]||0}"></div>`;
    });
    html+='</div>';
  });
  document.getElementById('snap-fields').innerHTML=html;
}

function saveSnap(){
  const date=document.getElementById('snap-date').value;
  if(!date){alert('請選擇日期');return;}
  const snap={date};
  FIELDS.forEach(f=>{
    const id='sf-'+f.key.replace(/[^\w]/g,'_');
    snap[f.key]=parseFloat(document.getElementById(id).value)||0;
  });
  const ex=snapshots.findIndex(s=>s.date===date);
  if(ex>=0){if(!confirm('此日期已有快照，確定覆蓋？'))return;snapshots[ex]=snap;}
  else snapshots.push(snap);
  snapshots.sort((a,b)=>a.date.localeCompare(b.date));
  save();
  alert('已儲存！');
  switchTab('overview');
}

function renderHistory(){
  if(!snapshots.length){
    document.getElementById('hist-head').innerHTML='';
    document.getElementById('hist-body').innerHTML='<tr><td colspan="6" class="empty">尚無快照</td></tr>';
    return;
  }
  document.getElementById('hist-head').innerHTML='<tr><th>日期</th><th>流動資產</th><th>固定資產</th><th>負債</th><th>Total NTD</th><th></th></tr>';
  document.getElementById('hist-body').innerHTML=snapshots.slice().reverse().map((s,i)=>{
    const idx=snapshots.length-1-i;
    const total=calcTotal(s);
    const prev=idx>0?calcTotal(snapshots[idx-1]):null;
    const diff=prev!==null?total-prev:null;
    const liquid=ALLOC_KEYS.slice(0,10).reduce((a,k)=>a+(s[k]||0),0);
    const fixed=(s['房子🏠']||0)+(s['車🚗']||0);
    const debt=DEBT_KEYS.reduce((a,k)=>a+Math.abs(s[k]||0),0);
    return`<tr>
      <td><strong>${s.date}</strong></td>
      <td>$${fmt(liquid)}</td><td>$${fmt(fixed)}</td>
      <td class="neg">-$${fmt(debt)}</td>
      <td><strong>$${fmt(total)}</strong>${diff!==null?`<br><span class="diff-sm ${diff>=0?'pos':'neg'}">${diff>=0?'▲':'▼'} $${fmt(Math.abs(diff))}</span>`:''}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-sm" onclick="editSnap(${idx})" style="margin-right:4px"><i class="ti ti-edit"></i></button>
        <button class="btn btn-sm btn-danger" onclick="deleteSnap(${idx})"><i class="ti ti-trash"></i></button>
      </td></tr>`;
  }).join('');
}

function editSnap(idx){
  const s=snapshots[idx];
  const groups=[...new Set(FIELDS.map(f=>f.group))];
  let html=`<div class="grid2" style="margin-bottom:14px"><div class="fl"><label>日期</label><input type="date" id="es-date" value="${s.date}"></div></div>`;
  groups.forEach(g=>{
    html+=`<div class="group-label">${g}</div><div class="grid3">`;
    FIELDS.filter(f=>f.group===g).forEach(f=>{
      const id='es-'+f.key.replace(/[^\w]/g,'_');
      html+=`<div class="fl"><label>${f.key}</label><input type="number" id="${id}" value="${s[f.key]||0}"></div>`;
    });
    html+='</div>';
  });
  document.getElementById('modal-title').textContent='編輯快照 '+s.date;
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal-bg').dataset.idx=idx;
  document.getElementById('modal-bg').classList.add('open');
}

function closeModal(){document.getElementById('modal-bg').classList.remove('open');}

function submitModal(){
  const idx=parseInt(document.getElementById('modal-bg').dataset.idx);
  const snap={date:document.getElementById('es-date').value};
  FIELDS.forEach(f=>{
    const id='es-'+f.key.replace(/[^\w]/g,'_');
    snap[f.key]=parseFloat(document.getElementById(id).value)||0;
  });
  snapshots[idx]=snap;
  snapshots.sort((a,b)=>a.date.localeCompare(b.date));
  save();closeModal();renderHistory();
}

function deleteSnap(idx){
  if(!confirm('確定刪除此快照？'))return;
  snapshots.splice(idx,1);save();renderHistory();
}

function exportJSON(){
  const blob=new Blob([JSON.stringify(snapshots,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='dynamic_assets_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}

function importJSON(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      snapshots=Array.isArray(data)?data:(data.snapshots||[]);
      snapshots.sort((a,b)=>a.date.localeCompare(b.date));
      save();renderOverview();alert('匯入成功！共 '+snapshots.length+' 筆快照');
    }catch{alert('JSON 格式錯誤');}
  };
  r.readAsText(file);
}

renderOverview();
document.getElementById('snap-date').value=new Date().toISOString().slice(0,10);
</script>
</body>
</html>
